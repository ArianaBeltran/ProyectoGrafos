<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor de Grafos</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>Editor de Grafos</h1>
    </header>

    <main>

        <aside>

            <!-- =========================
                 HERRAMIENTAS
            ========================== -->

            <div id="herramientas">

                <h2>Herramientas</h2>

                <button id="eliminarVertice">
                    Eliminar vértice
                </button>

                <button id="eliminarArista">
                    Eliminar arista
                </button>

            </div>


            <!-- =========================
                 BOTONES PRINCIPALES
            ========================== -->

            <button id="btnVertice">
                Crear vértice
            </button>

            <button id="crearArista">
                Crear arista
            </button>


            <!-- =========================
                 PANEL DE EDICIÓN DEL VÉRTICE
            ========================== -->

            <div id="panelEdicion" style="display: none;">

                <h3>Editar vértice</h3>

                <label for="nombreVertice">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombreVertice"
                >

                <label for="colorVertice">
                    Color:
                </label>

                <input
                    type="color"
                    id="colorVertice"
                    value="#ff0000"
                >

                <button id="guardarVertice">
                    Guardar
                </button>

            </div>


            <!-- =========================
                 PANEL DE CREACIÓN DE ARISTA
            ========================== -->

            <div id="panelArista" style="display: none;">

                <h3>Nueva arista</h3>


                <!-- ORIGEN -->

                <p>
                    Origen:
                    <span id="origenArista"></span>
                </p>


                <!-- DESTINO -->

                <p>
                    Destino:
                    <span id="destinoArista"></span>
                </p>


                <!-- =========================
                     PRIMERA DECISIÓN:
                     DIRIGIDA / NO DIRIGIDA
                ========================== -->

                <div id="tipoGrafo">

                    <p>
                        <strong>
                            Tipo de arista:
                        </strong>
                    </p>

                    <label>

                        <input
                            type="radio"
                            name="tipoGrafo"
                            id="aristaDirigida"
                            value="dirigida"
                            checked
                        >

                        Dirigida

                    </label>

                    <br>

                    <label>

                        <input
                            type="radio"
                            name="tipoGrafo"
                            id="aristaNoDirigida"
                            value="noDirigida"
                        >

                        No dirigida

                    </label>

                </div>


                <br>


                <!-- =========================
                     SEGUNDA DECISIÓN:
                     UNIDIRECCIONAL / BIDIRECCIONAL

                     SOLO SE UTILIZA SI
                     LA ARISTA ES DIRIGIDA
                ========================== -->

                <div id="tipoDireccion">

                    <p>
                        <strong>
                            Tipo de dirección:
                        </strong>
                    </p>

                    <label>

                        <input
                            type="radio"
                            name="tipoDireccion"
                            id="aristaUnidireccional"
                            value="unidireccional"
                            checked
                        >

                        Unidireccional

                    </label>

                    <br>

                    <label>

                        <input
                            type="radio"
                            name="tipoDireccion"
                            id="aristaBidireccional"
                            value="bidireccional"
                        >

                        Bidireccional

                    </label>

                </div>


                <br>


                <!-- =========================
                     PESO DE LA ARISTA
                ========================== -->

                <<div id="contenedorPesoIda">

                    <label for="pesoIda" id="etiquetaPesoIda">
                        Peso:
                    </label>

                    <input
                        type="number"
                        id="pesoIda"
                        value="1"
                        min="0"
                    >

                </div>


                <!-- =========================
                     PESO DE VUELTA

                     SOLO PARA:
                     DIRIGIDA + BIDIRECCIONAL
                ========================== -->

                <div
                    id="contenedorPesoVuelta"
                    style="display: none;"
                >

                    <br>

                    <label for="pesoVuelta">
                        Peso B → A:
                    </label>

                    <input
                        type="number"
                        id="pesoVuelta"
                        value="1"
                        min="0"
                    >

                </div>


                <br>


                <!-- =========================
                     BOTONES
                ========================== -->

                <button id="guardarArista">
                    Crear arista
                </button>

                <button id="cancelarArista">
                    Cancelar
                </button>

            </div>

        </aside>


        <!-- =========================
             ÁREA DEL GRAFO
        ========================== -->

        <section>

            <canvas id="canvasGrafo"></canvas>

        </section>

    </main>


    <!-- =========================
         ARCHIVOS JAVASCRIPT
    ========================== -->

    <script src="js/grafo.js"></script>

    <script src="js/vertice.js"></script>

    <script src="js/arista.js"></script>

    <script src="js/canvas.js"></script>

    <script src="js/interfaz.js"></script>

</body>

</html>
