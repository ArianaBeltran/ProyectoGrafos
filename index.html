<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor de Grafos</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>Editor de Grafos</h1>
    </header>

    <main>

        <aside>
            <div id="herramientas">

            <h2>Herramientas</h2>

            <!-- Tus herramientas actuales -->

            <button id="eliminarVertice">
                Eliminar vértice
            </button>

            <button id="eliminarArista">
                Eliminar arista
            </button>

        </div>

            <button id="btnVertice">
                Crear vértice
            </button>

            <button id="crearArista">--boton arista 
            Crear arista
            </button>
            <div id="panelEdicion" style="display: none;">

            <h3>Editar vértice</h3>

            <label for="nombreVertice">
                Nombre:
            </label>

            <input
                type="text"
                id="nombreVertice"
            >

            <label for="colorVertice">
                Color:
            </label>

            <input
                type="color"
                id="colorVertice"
                value="#ff0000"
            >

            <button id="guardarVertice">
                Guardar
            </button>

        </div>

            <div id="panelArista" style="display: none;">

        <h3>Nueva arista</h3>

        <p>
            Origen:
            <span id="origenArista"></span>
        </p>

        <p>
            Destino:
            <span id="destinoArista"></span>
        </p>

        <label>
            Tipo de arista:
        </label>

        <div>
            <input
                type="radio"
                id="unidireccional"
                name="tipoArista"
                value="unidireccional"
                checked
            >

            <label for="unidireccional">
                Unidireccional
            </label>
        </div>

        <div>
            <input
                type="radio"
                id="bidireccional"
                name="tipoArista"
                value="bidireccional"
            >

            <label for="bidireccional">
                Bidireccional
            </label>
        </div>

        <br>

        <div id="contenedorPesoIda">

        <label for="pesoIda">
            Peso A → B:
        </label>

        <input
            type="number"
            id="pesoIda"
            value="1"
            min="0"
        >

        </div>

        <br>

        <div id="contenedorPesoVuelta" style="display: none;">

            <label for="pesoVuelta">
                Peso B → A:
            </label>

            <input
                type="number"
                id="pesoVuelta"
                value="1"
                min="0"
            >

        </div>

        <br><br>

        <button id="guardarArista">
            Crear arista
        </button>

        <button id="cancelarArista">
            Cancelar
        </button>

    </div>
        </aside>

        <section>
            <canvas id="canvasGrafo"></canvas>
        </section>

    </main>

    <script src="js/grafo.js"></script>
    <script src="js/vertice.js"></script>
    <script src="js/arista.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/interfaz.js"></script>

</body>

</html>
